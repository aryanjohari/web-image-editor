name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Also type-checks: the build script runs tsc before vite build.
      - run: npm run build

      # api/talk.js is generated by the build but committed because Vercel runs it.
      # Fail if the committed copy no longer matches its source.
      - name: Check committed api/talk.js is up to date
        run: git diff --exit-code api/talk.js
