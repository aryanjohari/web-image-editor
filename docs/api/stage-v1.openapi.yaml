openapi: 3.1.0
info:
  title: Stage API
  version: stage-phase4-2026-08-11
  description: |
    Stage HTTP contract for brands + jobs (Phase 4).
    Happy-path jobs run Gemini synchronously and return status `succeeded` with a StageRecipe.
    Pack ZIP remains a client capability; artifacts endpoint is a metadata stub (no blob store).
    `POST /v1/assets` is not implemented in Phase 4.
    Lab UI continues to use keyless `POST /api/brief` and `POST /api/mood` (Gemini).
    In-memory store resets on cold start / redeploy. See docs/DIRECTION.md and docs/api/AUTH.md.
servers:
  - url: /api
    description: Same-origin Vite / Vercel deploy (paths prefixed as /api/v1 in handlers)

tags:
  - name: brands
  - name: assets
  - name: jobs
  - name: meta

paths:
  /v1/health:
    get:
      tags: [meta]
      summary: Liveness
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, contractVersion]
                properties:
                  ok: { type: boolean }
                  contractVersion: { type: string }

  /v1/brands:
    post:
      tags: [brands]
      summary: Create brand kit
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandKitCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandKit" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [brands]
      summary: List brand kits for the API key
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BrandKit" }

  /v1/brands/{brandId}:
    parameters:
      - $ref: "#/components/parameters/brandId"
    get:
      tags: [brands]
      summary: Get brand kit
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandKit" }
          description: OK
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [brands]
      summary: Update brand kit
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandKitPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandKit" }

  /v1/assets:
    post:
      tags: [assets]
      summary: Upload an image asset — NOT IMPLEMENTED in Phase 4 (deferred)
      description: |
        Deferred past Phase 4. Lab uploads stay client-side; API jobs return recipe JSON only.
      security: [{ ApiKeyAuth: [] }]
      responses:
        "501":
          description: Not implemented
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/jobs:
    post:
      tags: [jobs]
      summary: Create a Stage job from brief + brand (sync Gemini → recipe)
      description: |
        Runs in-request. On success returns Job with status `succeeded` and `recipe` set.
        `artifacts` starts empty. Pack ZIP is produced client-side in `/lab`, not by this endpoint.
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequest" }
      responses:
        "200":
          description: Job finished (succeeded or failed) with current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Gemini or API keys not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/jobId"
    get:
      tags: [jobs]
      summary: Job status, recipe, artifacts
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/jobs/{jobId}/patch:
    parameters:
      - $ref: "#/components/parameters/jobId"
    post:
      tags: [jobs]
      summary: Conversational follow-up — LLM returns recipe patch under brand rules
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        "200":
          description: Updated job with new recipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /v1/jobs/{jobId}/artifacts:
    parameters:
      - $ref: "#/components/parameters/jobId"
    post:
      tags: [jobs]
      summary: |
        Stub — append client-rendered pack artifact metadata (URLs only; no blob store).
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifacts]
              properties:
                artifacts:
                  type: array
                  items: { $ref: "#/components/schemas/ExportArtifact" }
      responses:
        "200":
          description: Job updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: stage_api_key
      description: |
        Header: Authorization: Bearer <key>
        Alternate: X-Stage-Key: <key>
        Env: STAGE_API_KEY and/or comma-separated STAGE_API_KEYS.
        No VITE_ secrets for API keys. Lab /api/brief stays keyless.

  parameters:
    brandId:
      name: brandId
      in: path
      required: true
      schema: { type: string }
    jobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    AssetKind:
      type: string
      enum: [image, logo, decal]

    AssetRef:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/AssetKind" }
        mime: { type: string }
        url: { type: string }
        width: { type: number }
        height: { type: number }

    BrandKit:
      type: object
      required: [id, name, colors, fonts]
      properties:
        id: { type: string }
        name: { type: string }
        voiceNotes: { type: string }
        colors:
          type: array
          items: { $ref: "#/components/schemas/ColorToken" }
        fonts:
          type: array
          items: { $ref: "#/components/schemas/FontToken" }
        logoAssetId: { type: string }
        limits: { $ref: "#/components/schemas/BrandLimits" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BrandKitCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        voiceNotes: { type: string }
        colors:
          type: array
          items: { $ref: "#/components/schemas/ColorToken" }
        fonts:
          type: array
          items: { $ref: "#/components/schemas/FontToken" }
        logoAssetId: { type: string }
        limits: { $ref: "#/components/schemas/BrandLimits" }

    BrandKitPatch:
      type: object
      properties:
        name: { type: string }
        voiceNotes: { type: string }
        colors:
          type: array
          items: { $ref: "#/components/schemas/ColorToken" }
        fonts:
          type: array
          items: { $ref: "#/components/schemas/FontToken" }
        logoAssetId: { type: string }
        limits: { $ref: "#/components/schemas/BrandLimits" }

    ColorToken:
      type: object
      required: [id, hex]
      properties:
        id: { type: string }
        hex: { type: string }
        role:
          type: string
          enum: [primary, secondary, accent, background, foreground, muted]

    FontToken:
      type: object
      required: [id, family]
      properties:
        id: { type: string }
        family: { type: string }
        role:
          type: string
          enum: [display, body, mono]
        weight: { type: number }

    BrandLimits:
      type: object
      properties:
        allowedLookIds:
          type: array
          items: { type: string }
        maxMeltIntensity: { type: number }
        maxNoiseLevel: { type: number }
        maxScanlineIntensity: { type: number }
        requireReducedMotionTwin: { type: boolean }

    JobRequest:
      type: object
      required: [brandId, brief]
      properties:
        brandId: { type: string }
        brief: { type: string }
        assetIds:
          type: array
          items: { type: string }
        baseRecipeId:
          type: string
          description: Optional job id whose recipe is used as conversational context
        options: { $ref: "#/components/schemas/JobOptions" }

    JobOptions:
      type: object
      properties:
        packProfileIds:
          type: array
          items: { type: string }
          description: Defaults to square, story, web_hero (client pack only in v1)
        allowPlateGeneration: { type: boolean, default: false }
        baseLookId: { type: string }

    JobStatus:
      type: string
      description: |
        Phase 4 happy path uses running → succeeded (with recipe) or failed.
        awaiting_client_render is reserved; not set by the sync Jobs API.
      enum:
        - queued
        - running
        - awaiting_client_render
        - succeeded
        - failed
        - cancelled

    Job:
      type: object
      required: [id, status, request, createdAt, updatedAt]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        request: { $ref: "#/components/schemas/JobRequest" }
        recipe: { $ref: "#/components/schemas/Recipe" }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/ExportArtifact" }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExportArtifact:
      type: object
      required: [packProfileId, kind]
      properties:
        packProfileId: { type: string }
        kind:
          type: string
          enum: [png, webm, json]
        url: { type: string }
        width: { type: number }
        height: { type: number }

    Recipe:
      type: object
      description: StageRecipe v3 — see src/lib/stage/types.ts
      required:
        - recipeSchemaVersion
        - engineVersion
        - layers
        - assets
        - viewport
        - baseTimeSeconds
      properties:
        recipeSchemaVersion: { type: integer, enum: [3] }
        engineVersion: { type: string }
        brandId: { type: string }
        targetPackProfileId: { type: string }
        layers:
          type: array
          items: { type: object }
        assets:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AssetRef" }
        viewport: { type: object }
        baseTimeSeconds: { type: number }
        baseLookId: { type: string }
        meta: { type: object }
